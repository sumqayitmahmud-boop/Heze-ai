<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heze AI</title>
<script>(function(){try{var t=localStorage.getItem('heze-theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ccircle%20cx='50'%20cy='50'%20r='48'%20fill='white'%20stroke='black'%20stroke-width='3'/%3E%3Ccircle%20cx='50'%20cy='50'%20r='40'%20fill='white'%20stroke='black'%20stroke-width='3'/%3E%3Cpolygon%20points='50,50%2045,38%2050,16%2055,38'%20fill='%233B6FE0'/%3E%3Cpolygon%20points='50,50%2055,38%2074,26%2062,45'%20fill='%23E0473B'/%3E%3Cpolygon%20points='50,50%2062,45%2084,50%2062,55'%20fill='%232FA35B'/%3E%3Cpolygon%20points='50,50%2062,55%2074,74%2055,62'%20fill='%233B6FE0'/%3E%3Cpolygon%20points='50,50%2055,62%2050,84%2045,62'%20fill='%23E0473B'/%3E%3Cpolygon%20points='50,50%2045,62%2026,74%2038,55'%20fill='%232FA35B'/%3E%3Cpolygon%20points='50,50%2038,55%2016,50%2038,45'%20fill='%233B6FE0'/%3E%3Cpolygon%20points='50,50%2038,45%2026,26%2045,38'%20fill='%23E0473B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
  :root{
    --bg-main:#0B0E1F;
    --bg-sidebar:#0E1226;
    --bg-soft:#1A2040;
    --bg-elevated:#171C38;
    --accent:#E8B944;
    --accent-dark:#C89526;
    --accent-teal:#3FC1B0;
    --text:#EEEBE4;
    --text-soft:#8B92B8;
    --border:rgba(255,255,255,.09);
    --border-strong:rgba(255,255,255,.16);
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  [data-theme="light"]{
    --bg-main:#F5F6FA;
    --bg-sidebar:#EEF0F6;
    --bg-soft:#E3E6F0;
    --bg-elevated:#FFFFFF;
    --text:#1B1E2E;
    --text-soft:#6B7094;
    --border:rgba(20,20,45,.10);
    --border-strong:rgba(20,20,45,.18);
  }
  [data-theme="light"] .cosmos{display:none;}
  [data-theme="light"] .empty-state h1{background:linear-gradient(135deg,#1B1E2E,var(--text-soft) 140%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font-body);
    color:var(--text);
    background:var(--bg-main);
    overflow:hidden;
    position:relative;
    transition:background .2s,color .2s;
  }
  button{font-family:inherit;}
  textarea,input{font-family:inherit;}

  /* Ambient starfield + aurora glow, purely decorative, sits behind everything */
  .cosmos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .cosmos::before{
    content:'';position:absolute;inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 70% 12%, rgba(255,255,255,.28), transparent),
      radial-gradient(1px 1px at 45% 65%, rgba(255,255,255,.22), transparent),
      radial-gradient(1.5px 1.5px at 85% 55%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,.2), transparent),
      radial-gradient(1.5px 1.5px at 60% 85%, rgba(255,255,255,.25), transparent),
      radial-gradient(1px 1px at 92% 25%, rgba(255,255,255,.22), transparent);
    opacity:.5;
  }
  .aurora{
    position:absolute;top:-20%;left:50%;width:900px;height:900px;
    transform:translateX(-50%);
    background:
      radial-gradient(circle at 50% 50%, rgba(232,185,68,.14), transparent 55%),
      radial-gradient(circle at 60% 40%, rgba(63,193,176,.10), transparent 55%);
    filter:blur(20px);
    animation:auroraPulse 10s ease-in-out infinite;
  }
  @keyframes auroraPulse{
    0%,100%{opacity:.7;transform:translateX(-50%) scale(1);}
    50%{opacity:1;transform:translateX(-50%) scale(1.08);}
  }

  .app{display:flex;height:100vh;position:relative;z-index:1;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:268px;flex-shrink:0;background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    padding:20px 13px;
    transition:transform .25s cubic-bezier(.4,0,.2,1),background .2s;
    z-index:20;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-display);
    font-size:19px;font-weight:700;letter-spacing:-.01em;
    padding:2px 8px 20px;
    color:var(--text);
  }
  .brand svg{flex-shrink:0;filter:drop-shadow(0 0 10px rgba(232,185,68,.25));}
  .new-chat-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#1A1305;border:none;border-radius:12px;
    padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;
    transition:filter .15s,transform .1s;
    box-shadow:0 4px 18px rgba(232,185,68,.22);
  }
  .new-chat-btn:hover{filter:brightness(1.08);}
  .new-chat-btn:active{transform:scale(.98);}
  .new-chat-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .sidebar-search{
    display:flex;align-items:center;gap:8px;background:var(--bg-elevated);
    border:1px solid var(--border);border-radius:10px;padding:8px 11px;margin:14px 0 4px;
  }
  .sidebar-search svg{flex-shrink:0;color:var(--text-soft);}
  .sidebar-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:12.5px;}
  .sidebar-search input::placeholder{color:var(--text-soft);}

  .history-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--text-soft);padding:20px 10px 8px;font-weight:600;
  }
  .history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .history-item{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:10px 8px 10px 11px;border-radius:9px;font-size:13.5px;color:var(--text-soft);
    cursor:pointer;
    transition:background .15s,color .15s;
    border:1px solid transparent;
  }
  .history-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
  .history-actions{display:none;align-items:center;gap:1px;flex-shrink:0;}
  .history-item:hover .history-actions,.history-item:focus-within .history-actions{display:flex;}
  .hist-btn{background:none;border:none;color:var(--text-soft);cursor:pointer;padding:5px;border-radius:6px;display:flex;flex-shrink:0;}
  .hist-btn:hover{background:var(--bg-main);color:var(--text);}
  .history-rename-input{
    width:100%;background:var(--bg-main);border:1px solid var(--accent);border-radius:6px;
    padding:5px 8px;color:var(--text);font-size:13px;outline:none;
  }
  .history-empty{padding:16px 10px;font-size:12.5px;color:var(--text-soft);text-align:center;opacity:.8;}
  .history-item:hover{background:var(--bg-soft);color:var(--text);}
  .history-item.active{
    background:var(--bg-elevated);color:var(--text);font-weight:600;
    border-color:var(--border-strong);
    box-shadow:inset 2px 0 0 var(--accent);
  }
  .history-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .sidebar-footer{
    font-size:11px;color:var(--text-soft);opacity:.85;padding:12px 8px 0;
    display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;
  }
  .sidebar-footer-actions{display:flex;gap:2px;}
  .icon-btn{background:none;border:none;color:var(--text-soft);cursor:pointer;padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
  .icon-btn:hover{background:var(--bg-soft);color:var(--text);}
  .export-menu{
    display:none;position:absolute;bottom:34px;right:0;background:var(--bg-elevated);
    border:1px solid var(--border-strong);border-radius:10px;padding:5px;min-width:170px;
    box-shadow:0 8px 28px rgba(0,0,0,.4);z-index:30;flex-direction:column;gap:2px;
  }
  .export-menu.open{display:flex;}
  .export-menu button{background:none;border:none;color:var(--text);text-align:left;padding:9px 10px;border-radius:7px;font-size:12.5px;cursor:pointer;}
  .export-menu button:hover{background:var(--bg-soft);}
  .sidebar-close{display:none;}

  /* ---------- Main chat area ---------- */
  .chat-area{flex:1;display:flex;flex-direction:column;min-width:0;background:transparent;position:relative;}

  .mobile-topbar{
    display:none;align-items:center;gap:12px;padding:14px 16px;
    border-bottom:1px solid var(--border);background:rgba(11,14,31,.85);
    backdrop-filter:blur(10px);position:relative;z-index:2;
  }
  [data-theme="light"] .mobile-topbar{background:rgba(245,246,250,.85);}
  .mobile-topbar button{background:none;border:none;cursor:pointer;padding:4px;color:var(--text);}
  .mobile-topbar strong{font-family:var(--font-display);font-weight:700;}

  .messages{flex:1;overflow-y:auto;padding:8px 0 20px;position:relative;}
  .messages-inner{max-width:720px;margin:0 auto;padding:20px 24px 0;display:flex;flex-direction:column;gap:22px;}

  .empty-state{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px;gap:8px;position:relative;
  }
  .empty-state .mark{margin-bottom:14px;position:relative;}
  .empty-state .mark::after{
    content:'';position:absolute;inset:-18px;border-radius:50%;
    background:radial-gradient(circle, rgba(232,185,68,.22), transparent 70%);
    filter:blur(4px);z-index:-1;
    animation:markGlow 3.4s ease-in-out infinite;
  }
  @keyframes markGlow{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.12);}}
  .empty-state h1{
    font-family:var(--font-display);font-size:28px;margin:0;font-weight:700;
    letter-spacing:-.02em;
    background:linear-gradient(135deg,#fff,var(--text-soft) 140%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .empty-state p{color:var(--text-soft);font-size:14.5px;margin:0 0 16px;}
  .suggestions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:500px;}
  .suggestion-chip{
    border:1px solid var(--border);background:var(--bg-elevated);border-radius:11px;
    padding:10px 15px;font-size:13px;color:var(--text);cursor:pointer;
    transition:border-color .15s,background .15s,transform .1s;
  }
  .suggestion-chip:hover{border-color:var(--accent);background:var(--bg-soft);transform:translateY(-1px);}
  .suggestion-chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .msg{display:flex;gap:11px;animation:fadeIn .3s cubic-bezier(.2,.7,.3,1);}
  .msg.user{flex-direction:row-reverse;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:700;color:#1A1305;margin-top:2px;
  }
  .avatar.user-avatar{background:linear-gradient(135deg,var(--accent-teal),#2A8C7E);color:#062420;}

  .msg-col{display:flex;flex-direction:column;min-width:0;max-width:calc(100% - 41px);}
  .msg.user .msg-col{align-items:flex-end;}

  .bubble{padding:12px 17px;border-radius:16px;font-size:15px;line-height:1.65;max-width:100%;min-width:0;}
  .msg.user .bubble{
    background:linear-gradient(135deg,var(--bg-soft),var(--bg-elevated));
    color:var(--text);border-top-right-radius:5px;white-space:pre-wrap;word-wrap:break-word;
    border:1px solid var(--border);
  }
  .msg.assistant .bubble{
    background:var(--bg-elevated);border:1px solid var(--border);
    border-top-left-radius:5px;overflow-x:auto;
  }
  .msg.error .bubble{border-color:rgba(224,71,59,.4);}
  .bubble p{margin:0 0 10px;}
  .bubble p:last-child{margin-bottom:0;}
  .bubble h1,.bubble h2,.bubble h3,.bubble h4{font-family:var(--font-display);font-weight:700;line-height:1.3;margin:16px 0 8px;color:var(--text);}
  .bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child,.bubble h4:first-child{margin-top:0;}
  .bubble h1{font-size:20px;}
  .bubble h2{font-size:17.5px;}
  .bubble h3{font-size:15.5px;}
  .bubble h4{font-size:14.5px;}
  .bubble strong{font-weight:700;color:var(--text);}
  .bubble em{font-style:italic;}
  .bubble del{opacity:.6;}
  .bubble blockquote{margin:10px 0;padding:2px 14px;border-left:3px solid var(--accent);color:var(--text-soft);font-style:italic;}
  .bubble hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
  .bubble table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px;display:block;overflow-x:auto;}
  .bubble th,.bubble td{border:1px solid var(--border);padding:7px 11px;text-align:left;}
  .bubble th{background:var(--bg-soft);font-weight:600;}
  .bubble pre{background:#0B0E1F;padding:13px 15px;border-radius:10px;overflow-x:auto;font-size:13px;margin:0 0 8px;border:1px solid var(--border);}
  .bubble pre.has-header{border-top-left-radius:0;border-top-right-radius:0;border-top:none;}
  .bubble code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
  .bubble :not(pre)>code{background:var(--bg-soft);padding:2px 6px;border-radius:5px;font-size:13px;color:var(--accent-teal);}
  .bubble ul,.bubble ol{margin:0 0 10px;padding-left:20px;}
  .bubble li{margin:3px 0;}
  .bubble a{color:var(--accent);}

  .code-header{
    display:flex;align-items:center;justify-content:space-between;
    background:#11162c;color:#8B92B8;border:1px solid rgba(255,255,255,.08);border-bottom:none;
    border-radius:10px 10px 0 0;padding:7px 13px;font-size:11px;letter-spacing:.02em;margin-top:8px;
  }
  .code-header .code-lang{text-transform:lowercase;}
  .code-copy-btn{background:none;border:none;color:inherit;cursor:pointer;display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:6px;font-size:11px;}
  .code-copy-btn:hover{background:rgba(255,255,255,.08);color:#EEEBE4;}

  .msg-attachment-img{max-width:220px;max-height:220px;border-radius:10px;display:block;margin-bottom:8px;object-fit:cover;}
  .bubble .msg-text{white-space:pre-wrap;word-wrap:break-word;}
  .stream-text{white-space:pre-wrap;word-wrap:break-word;}

  .msg-actions{display:flex;gap:2px;margin-top:5px;opacity:0;transition:opacity .15s;}
  .msg:hover .msg-actions,.msg:focus-within .msg-actions{opacity:1;}
  .msg-act-btn{
    display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--text-soft);
    cursor:pointer;padding:5px 7px;border-radius:7px;font-size:11.5px;transition:background .15s,color .15s;
  }
  .msg-act-btn:hover{background:var(--bg-soft);color:var(--text);}
  .msg-act-btn.retry-btn{color:#E0776B;}
  .msg-act-btn.retry-btn:hover{background:rgba(224,71,59,.12);color:#E0473B;}

  .edit-box{display:flex;flex-direction:column;gap:8px;width:100%;max-width:460px;}
  .edit-textarea{
    width:100%;min-height:70px;background:var(--bg-elevated);border:1px solid var(--border-strong);
    border-radius:12px;padding:10px 13px;color:var(--text);font-size:14.5px;line-height:1.5;resize:vertical;outline:none;
  }
  .edit-textarea:focus{border-color:var(--accent);}
  .edit-actions{display:flex;justify-content:flex-end;gap:8px;}
  .edit-save-btn,.edit-cancel-btn{border:none;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .edit-save-btn{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#1A1305;}
  .edit-cancel-btn{background:var(--bg-soft);color:var(--text-soft);}

  .typing .bubble{display:flex;align-items:center;gap:5px;padding:15px 17px;}
  .typing .bubble span{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.1s infinite ease-in-out;}
  .typing .bubble span:nth-child(2){animation-delay:.15s;}
  .typing .bubble span:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,60%,100%{opacity:.3;transform:scale(.85);}30%{opacity:1;transform:scale(1);}}

  .input-bar{border-top:1px solid var(--border);padding:14px 24px 20px;position:relative;z-index:2;background:rgba(11,14,31,.6);backdrop-filter:blur(10px);}
  [data-theme="light"] .input-bar{background:rgba(245,246,250,.75);}
  .attachment-preview{max-width:720px;margin:0 auto 8px;display:none;}
  .attachment-chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--bg-elevated);
    border:1px solid var(--border);border-radius:11px;padding:6px 10px 6px 6px;font-size:12.5px;color:var(--text);
  }
  .attachment-chip img{width:30px;height:30px;object-fit:cover;border-radius:6px;}
  .attachment-chip .file-chip-icon{width:30px;height:30px;border-radius:6px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;color:var(--text-soft);}
  .attachment-chip button{background:none;border:none;color:var(--text-soft);cursor:pointer;display:flex;padding:2px;border-radius:5px;}
  .attachment-chip button:hover{color:var(--text);background:var(--bg-soft);}

  .input-inner{
    max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:4px;
    background:var(--bg-elevated);border:1px solid var(--border);border-radius:22px;
    padding:6px 6px 6px 8px;
    transition:border-color .15s,box-shadow .15s;
  }
  .input-inner:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(232,185,68,.12);
  }
  .attach-btn{
    width:34px;height:34px;border-radius:50%;background:none;border:none;color:var(--text-soft);
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .15s,color .15s;margin-bottom:1px;
  }
  .attach-btn:hover{background:var(--bg-soft);color:var(--text);}
  #userInput{
    flex:1;border:none;background:transparent;resize:none;outline:none;
    font-size:15px;line-height:1.5;max-height:160px;padding:10px 4px;color:var(--text);
  }
  #userInput::placeholder{color:var(--text-soft);}
  #sendBtn{
    width:37px;height:37px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
    transition:filter .15s,transform .1s,background .15s;color:#1A1305;
    box-shadow:0 2px 10px rgba(232,185,68,.3);
  }
  #sendBtn:hover{filter:brightness(1.08);}
  #sendBtn:active{transform:scale(.92);}
  #sendBtn.stop-mode{background:linear-gradient(135deg,#E0473B,#B8362C);box-shadow:0 2px 10px rgba(224,71,59,.3);color:#fff;}
  #sendBtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .hint{max-width:720px;margin:8px auto 0;font-size:11px;color:var(--text-soft);text-align:center;padding:0 24px;opacity:.7;}

  .backdrop{display:none;}

  ::selection{background:rgba(232,185,68,.3);color:var(--text);}

  .messages::-webkit-scrollbar,.history::-webkit-scrollbar{width:8px;}
  .messages::-webkit-scrollbar-thumb,.history::-webkit-scrollbar-thumb{background:var(--bg-soft);border-radius:8px;}
  .messages::-webkit-scrollbar-track,.history::-webkit-scrollbar-track{background:transparent;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

  @media (max-width:760px){
    .mobile-topbar{display:flex;}
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);
    }
    .sidebar.open{transform:translateX(0);box-shadow:2px 0 32px rgba(0,0,0,.5);}
    .sidebar-close{display:block;margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text-soft);}
    .backdrop{display:none;position:fixed;inset:0;background:rgba(5,6,15,.6);backdrop-filter:blur(2px);z-index:15;}
    .backdrop.open{display:block;}
    .messages-inner{padding:16px 16px 0;}
    .input-bar{padding:12px 14px 16px;}
  }

  @media print{
    .sidebar,.mobile-topbar,.input-bar,.backdrop,.cosmos,.export-menu{display:none !important;}
    body,.app,.chat-area,.messages{background:#fff !important;color:#000 !important;height:auto !important;overflow:visible !important;}
    .messages-inner{max-width:100% !important;padding:0 !important;}
    .msg-actions{display:none !important;}
    .bubble{background:#fff !important;color:#000 !important;border:1px solid #ddd !important;box-shadow:none !important;}
    .avatar{display:none !important;}
    .msg{break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="cosmos"><div class="aurora"></div></div>
<div class="app">
  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#1A1A1A" stroke-width="2.4"/>
        <circle cx="50" cy="50" r="40" fill="#ffffff" stroke="#1A1A1A" stroke-width="2.4"/>
        <polygon points="50,50 45.02,37.99 50,16 54.98,37.99" fill="#3B6FE0"/>
        <polygon points="50,50 54.98,37.99 74.04,25.96 62.01,45.02" fill="#E0473B"/>
        <polygon points="50,50 62.01,45.02 84,50 62.01,54.98" fill="#2FA35B"/>
        <polygon points="50,50 62.01,54.98 74.04,74.04 54.98,62.01" fill="#3B6FE0"/>
        <polygon points="50,50 54.98,62.01 50,84 45.02,62.01" fill="#E0473B"/>
        <polygon points="50,50 45.02,62.01 25.96,74.04 37.99,54.98" fill="#2FA35B"/>
        <polygon points="50,50 37.99,54.98 16,50 37.99,45.02" fill="#3B6FE0"/>
        <polygon points="50,50 37.99,45.02 25.96,25.96 45.02,37.99" fill="#E0473B"/>
      </svg>
      <span>Heze AI</span>
      <button class="sidebar-close" id="sidebarClose" aria-label="Bağla">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      Yeni söhbət
    </button>
    <div class="sidebar-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="historySearch" placeholder="Söhbətlərdə axtar...">
    </div>
    <div class="history-label">Söhbətlər</div>
    <div class="history" id="historyList"></div>
    <div class="sidebar-footer">
      <span>Sadə, sürətli, sənin dilində</span>
      <div class="sidebar-footer-actions">
        <button class="icon-btn" id="exportBtn" title="İxrac et" aria-label="İxrac et">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        </button>
        <button class="icon-btn" id="themeToggle" title="Tema" aria-label="Tema"></button>
        <div class="export-menu" id="exportMenu">
          <button type="button" data-format="txt">Mətn (.txt) kimi</button>
          <button type="button" data-format="pdf">PDF kimi (çap et)</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="chat-area">
    <div class="mobile-topbar">
      <button id="menuBtn" aria-label="Menyu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <strong>Heze AI</strong>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <div class="attachment-preview" id="attachmentPreview"></div>
      <div class="input-inner">
        <button class="attach-btn" id="attachBtn" type="button" aria-label="Fayl əlavə et" title="Fayl əlavə et">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95L10.13 17.1a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="fileInput" accept="image/*,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.log" hidden>
        <textarea id="userInput" rows="1" placeholder="Heze AI-ə mesaj yaz..."></textarea>
        <button id="sendBtn" aria-label="Göndər" title="Göndər">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="hint">Enter — göndər · Shift+Enter — yeni sətir</div>
    </div>
  </main>
</div>

<script>
  /* ---------- Icons ---------- */
  const COPY_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
  const CHECK_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>';
  const EDIT_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const REGEN_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>';
  const RETRY_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>';
  const FILE_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
  const CLOSE_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const SEND_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  const STOP_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
  const SUN_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
  const MOON_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>';
  const DELETE_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';

  if(window.marked){ marked.setOptions({ gfm:true, breaks:false }); }

  function logoSvg(size){
    size = size || 28;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'
      + '<circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#1A1A1A" stroke-width="2.4"/>'
      + '<circle cx="50" cy="50" r="40" fill="#ffffff" stroke="#1A1A1A" stroke-width="2.4"/>'
      + '<polygon points="50,50 45.02,37.99 50,16 54.98,37.99" fill="#3B6FE0"/>'
      + '<polygon points="50,50 54.98,37.99 74.04,25.96 62.01,45.02" fill="#E0473B"/>'
      + '<polygon points="50,50 62.01,45.02 84,50 62.01,54.98" fill="#2FA35B"/>'
      + '<polygon points="50,50 62.01,54.98 74.04,74.04 54.98,62.01" fill="#3B6FE0"/>'
      + '<polygon points="50,50 54.98,62.01 50,84 45.02,62.01" fill="#E0473B"/>'
      + '<polygon points="50,50 45.02,62.01 25.96,74.04 37.99,54.98" fill="#2FA35B"/>'
      + '<polygon points="50,50 37.99,54.98 16,50 37.99,45.02" fill="#3B6FE0"/>'
      + '<polygon points="50,50 37.99,45.02 25.96,25.96 45.02,37.99" fill="#E0473B"/>'
      + '</svg>';
  }

  const SUGGESTIONS = [
    'Salam de və özünü tanıt',
    'Sadə bir Python funksiyası yaz',
    'Azərbaycan tarixindən maraqlı bir fakt söylə',
    'Qısa bir hekayə yaz'
  ];

  let conversations = [];
  let currentId = null;
  let editingIdx = null;
  let historyQuery = '';
  let isGenerating = false;
  let currentAbortController = null;
  let typewriterTimer = null;
  let pendingTypewriterResolve = null;
  let pendingAttachment = null;

  const historyList   = document.getElementById('historyList');
  const messagesEl    = document.getElementById('messages');
  const userInput     = document.getElementById('userInput');
  const sendBtn       = document.getElementById('sendBtn');
  const sidebar       = document.getElementById('sidebar');
  const backdrop      = document.getElementById('backdrop');
  const attachBtn     = document.getElementById('attachBtn');
  const fileInput     = document.getElementById('fileInput');
  const attachmentPreviewEl = document.getElementById('attachmentPreview');
  const exportBtn     = document.getElementById('exportBtn');
  const exportMenu    = document.getElementById('exportMenu');
  const themeToggleBtn = document.getElementById('themeToggle');
  const historySearchInput = document.getElementById('historySearch');

  function uid(){ return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

  /* ---------- Theme ---------- */
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeToggleBtn.innerHTML = theme === 'light' ? MOON_ICON : SUN_ICON;
    themeToggleBtn.title = theme === 'light' ? 'Tünd temaya keç' : 'Açıq temaya keç';
    try{ localStorage.setItem('heze-theme', theme); }catch(e){}
  }
  function initTheme(){
    let saved = 'dark';
    try{ saved = localStorage.getItem('heze-theme') || 'dark'; }catch(e){}
    applyTheme(saved);
  }
  themeToggleBtn.onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    applyTheme(cur === 'light' ? 'dark' : 'light');
  };

  /* ---------- State load/save ---------- */
  async function loadState(){
    try{
      const raw = localStorage.getItem('heze-conversations');
      if(raw){ conversations = JSON.parse(raw); }
    }catch(e){ conversations = []; }
    if(conversations.length){
      currentId = conversations[0].id;
    } else {
      newChat();
    }
    renderAll();
  }

  async function saveState(){
    try{ localStorage.setItem('heze-conversations', JSON.stringify(conversations)); }
    catch(e){ console.error('Yaddaşa yazma xətası:', e); }
  }

  function newChat(){
    const conv = {id: uid(), title: null, messages: []};
    conversations.unshift(conv);
    currentId = conv.id;
    editingIdx = null;
    renderAll();
    saveState();
    closeSidebarMobile();
    userInput.focus();
  }

  function openConversation(id){
    const conv = conversations.find(c => c.id === id);
    if(!conv) return;
    currentId = id;
    editingIdx = null;
    renderAll();
    closeSidebarMobile();
  }

  function renderAll(){
    renderHistory();
    renderMessages();
  }

  /* ---------- History (search / rename / delete) ---------- */
  function renderHistory(){
    historyList.innerHTML = '';
    const q = historyQuery.trim().toLowerCase();
    const list = q ? conversations.filter(c => (c.title || 'Yeni söhbət').toLowerCase().includes(q)) : conversations;

    if(list.length === 0){
      const empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = q ? 'Nəticə tapılmadı.' : 'Hələ söhbət yoxdur.';
      historyList.appendChild(empty);
      return;
    }

    list.forEach(c => {
      const div = document.createElement('div');
      div.className = 'history-item' + (c.id === currentId ? ' active' : '');
      div.tabIndex = 0;

      const titleSpan = document.createElement('span');
      titleSpan.className = 'history-title';
      titleSpan.textContent = c.title || 'Yeni söhbət';
      div.appendChild(titleSpan);

      const actions = document.createElement('span');
      actions.className = 'history-actions';

      const renameBtn = document.createElement('button');
      renameBtn.className = 'hist-btn';
      renameBtn.type = 'button';
      renameBtn.title = 'Adını dəyiş';
      renameBtn.innerHTML = EDIT_ICON;
      renameBtn.onclick = (e) => { e.stopPropagation(); startRename(div, c); };
      actions.appendChild(renameBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'hist-btn';
      delBtn.type = 'button';
      delBtn.title = 'Sil';
      delBtn.innerHTML = DELETE_ICON;
      delBtn.onclick = (e) => { e.stopPropagation(); deleteConversation(c.id); };
      actions.appendChild(delBtn);

      div.appendChild(actions);
      div.onclick = () => openConversation(c.id);
      div.onkeydown = (e) => { if(e.key === 'Enter') openConversation(c.id); };
      historyList.appendChild(div);
    });
  }

  function startRename(div, c){
    div.innerHTML = '';
    const input = document.createElement('input');
    input.className = 'history-rename-input';
    input.value = c.title || 'Yeni söhbət';
    div.appendChild(input);
    input.focus();
    input.select();
    const commit = () => {
      const v = input.value.trim();
      c.title = v || c.title || 'Yeni söhbət';
      saveState();
      renderHistory();
    };
    input.onblur = commit;
    input.onkeydown = (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); commit(); }
      if(e.key === 'Escape'){ e.preventDefault(); renderHistory(); }
    };
  }

  function deleteConversation(id){
    const conv = conversations.find(c => c.id === id);
    const title = conv ? (conv.title || 'Yeni söhbət') : 'bu söhbət';
    if(!confirm('"' + title + '" söhbətini silmək istəyirsən? Bu geri qaytarılmır.')) return;
    conversations = conversations.filter(c => c.id !== id);
    if(currentId === id){
      if(conversations.length){ currentId = conversations[0].id; renderAll(); saveState(); }
      else { newChat(); }
      return;
    }
    renderHistory();
    saveState();
  }

  historySearchInput.addEventListener('input', (e) => {
    historyQuery = e.target.value;
    renderHistory();
  });

  /* ---------- Messages rendering ---------- */
  function renderMessages(){
    const conv = conversations.find(c => c.id === currentId);
    messagesEl.innerHTML = '';
    if(!conv || conv.messages.length === 0){
      messagesEl.appendChild(buildEmptyState());
      return;
    }
    const inner = document.createElement('div');
    inner.className = 'messages-inner';
    conv.messages.forEach((m, idx) => inner.appendChild(buildMsgEl(m, idx)));
    messagesEl.appendChild(inner);
    enhanceCodeBlocks(inner);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function buildEmptyState(){
    const wrap = document.createElement('div');
    wrap.className = 'empty-state';
    const markWrap = document.createElement('div');
    markWrap.className = 'mark';
    markWrap.innerHTML = logoSvg(52);
    wrap.appendChild(markWrap);
    const h1 = document.createElement('h1');
    h1.textContent = 'Heze AI-a xoş gəlmisən';
    const p = document.createElement('p');
    p.textContent = 'Sualını aşağıya yaz, ya da bir təklifə toxun.';
    wrap.appendChild(h1);
    wrap.appendChild(p);
    const chips = document.createElement('div');
    chips.className = 'suggestions';
    SUGGESTIONS.forEach(s => {
      const chip = document.createElement('button');
      chip.className = 'suggestion-chip';
      chip.type = 'button';
      chip.textContent = s;
      chip.onclick = () => { userInput.value = s; sendMessage(); };
      chips.appendChild(chip);
    });
    wrap.appendChild(chips);
    return wrap;
  }

  function buildMsgEl(m, idx){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + m.role + (m.isError ? ' error' : '');

    const avatar = document.createElement('div');
    avatar.className = 'avatar' + (m.role === 'user' ? ' user-avatar' : '');

    const col = document.createElement('div');
    col.className = 'msg-col';

    if(m.role === 'user'){
      avatar.textContent = 'Sən';
      if(idx === editingIdx){
        col.appendChild(buildEditBox(m, idx));
        wrap.appendChild(avatar);
        wrap.appendChild(col);
        return wrap;
      }
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if(m.attachment && m.attachment.type === 'image'){
        const img = document.createElement('img');
        img.className = 'msg-attachment-img';
        img.src = m.attachment.dataUrl;
        img.alt = m.attachment.name || 'şəkil';
        bubble.appendChild(img);
        const txt = document.createElement('div');
        txt.className = 'msg-text';
        txt.textContent = m.content;
        bubble.appendChild(txt);
      } else {
        bubble.textContent = m.content;
      }
      col.appendChild(bubble);
      col.appendChild(buildMsgActions(m, idx));
    } else {
      avatar.innerHTML = logoSvg(29);
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = window.marked ? marked.parse(m.content || '') : (m.content || '');
      col.appendChild(bubble);
      col.appendChild(buildMsgActions(m, idx));
    }

    wrap.appendChild(avatar);
    wrap.appendChild(col);
    return wrap;
  }

  function buildMsgActions(m, idx){
    const bar = document.createElement('div');
    bar.className = 'msg-actions';

    if(m.isError){
      const retryBtn = document.createElement('button');
      retryBtn.className = 'msg-act-btn retry-btn';
      retryBtn.type = 'button';
      retryBtn.innerHTML = RETRY_ICON + '<span>Yenidən cəhd et</span>';
      retryBtn.onclick = () => regenerateMessage(idx);
      bar.appendChild(retryBtn);
      return bar;
    }

    const copyBtn = document.createElement('button');
    copyBtn.className = 'msg-act-btn';
    copyBtn.type = 'button';
    copyBtn.title = 'Kopyala';
    copyBtn.innerHTML = COPY_ICON;
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(m.content || '').then(() => {
        copyBtn.innerHTML = CHECK_ICON;
        setTimeout(() => { copyBtn.innerHTML = COPY_ICON; }, 1200);
      }).catch(() => {});
    };
    bar.appendChild(copyBtn);

    if(m.role === 'user'){
      const editBtn = document.createElement('button');
      editBtn.className = 'msg-act-btn';
      editBtn.type = 'button';
      editBtn.title = 'Redaktə et';
      editBtn.innerHTML = EDIT_ICON;
      editBtn.onclick = () => { editingIdx = idx; renderMessages(); };
      bar.appendChild(editBtn);
    } else {
      const regenBtn = document.createElement('button');
      regenBtn.className = 'msg-act-btn';
      regenBtn.type = 'button';
      regenBtn.title = 'Yenidən cavabla';
      regenBtn.innerHTML = REGEN_ICON;
      regenBtn.onclick = () => regenerateMessage(idx);
      bar.appendChild(regenBtn);
    }
    return bar;
  }

  function buildEditBox(m, idx){
    const box = document.createElement('div');
    box.className = 'edit-box';
    const ta = document.createElement('textarea');
    ta.className = 'edit-textarea';
    ta.value = m.content;
    const actions = document.createElement('div');
    actions.className = 'edit-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'edit-cancel-btn';
    cancelBtn.type = 'button';
    cancelBtn.textContent = 'Ləğv et';
    cancelBtn.onclick = () => { editingIdx = null; renderMessages(); };
    const saveBtn = document.createElement('button');
    saveBtn.className = 'edit-save-btn';
    saveBtn.type = 'button';
    saveBtn.textContent = 'Göndər';
    saveBtn.onclick = () => saveEdit(idx, ta.value);
    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);
    box.appendChild(ta);
    box.appendChild(actions);
    setTimeout(() => { ta.focus(); ta.selectionStart = ta.value.length; }, 0);
    return box;
  }

  function saveEdit(idx, newText){
    newText = newText.trim();
    if(!newText || isGenerating) return;
    const conv = conversations.find(c => c.id === currentId);
    if(!conv) return;
    conv.messages = conv.messages.slice(0, idx);
    conv.messages.push({role:'user', content:newText});
    editingIdx = null;
    renderHistory();
    renderMessages();
    saveState();
    requestAssistantReply(conv);
  }

  function regenerateMessage(idx){
    if(isGenerating) return;
    const conv = conversations.find(c => c.id === currentId);
    if(!conv) return;
    conv.messages = conv.messages.slice(0, idx);
    renderMessages();
    saveState();
    requestAssistantReply(conv);
  }

  /* ---------- Code block copy + language label ---------- */
  function enhanceCodeBlocks(container){
    container.querySelectorAll('pre').forEach(pre => {
      if(pre.dataset.enhanced) return;
      pre.dataset.enhanced = '1';
      const code = pre.querySelector('code');
      if(!code) return;
      let lang = '';
      const m = (code.className || '').match(/language-([\w+-]+)/);
      if(m) lang = m[1];
      if(window.hljs){ try{ hljs.highlightElement(code); }catch(e){} }

      const header = document.createElement('div');
      header.className = 'code-header';
      const langLabel = document.createElement('span');
      langLabel.className = 'code-lang';
      langLabel.textContent = lang || 'kod';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'code-copy-btn';
      copyBtn.type = 'button';
      copyBtn.innerHTML = COPY_ICON + '<span>Kopyala</span>';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(code.textContent || '').then(() => {
          copyBtn.innerHTML = CHECK_ICON + '<span>Kopyalandı</span>';
          setTimeout(() => { copyBtn.innerHTML = COPY_ICON + '<span>Kopyala</span>'; }, 1200);
        }).catch(() => {});
      };
      header.appendChild(langLabel);
      header.appendChild(copyBtn);
      pre.parentNode.insertBefore(header, pre);
      pre.classList.add('has-header');
    });
  }

  /* ---------- Streaming / typing bubble helpers ---------- */
  function showTyping(){
    let inner = messagesEl.querySelector('.messages-inner');
    if(!inner){
      messagesEl.innerHTML = '';
      inner = document.createElement('div');
      inner.className = 'messages-inner';
      messagesEl.appendChild(inner);
    }
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant typing';
    wrap.id = 'typingRow';
    wrap.innerHTML =
      '<div class="avatar">' + logoSvg(29) + '</div>' +
      '<div class="msg-col"><div class="bubble"><span></span><span></span><span></span></div></div>';
    inner.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping(){
    const row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  function ensureStreamBubble(){
    let row = document.getElementById('typingRow');
    if(!row){
      let inner = messagesEl.querySelector('.messages-inner');
      if(!inner){
        messagesEl.innerHTML = '';
        inner = document.createElement('div');
        inner.className = 'messages-inner';
        messagesEl.appendChild(inner);
      }
      row = document.createElement('div');
      row.className = 'msg assistant';
      row.id = 'typingRow';
      row.innerHTML = '<div class="avatar">' + logoSvg(29) + '</div><div class="msg-col"><div class="bubble"></div></div>';
      inner.appendChild(row);
    }
    row.classList.remove('typing');
    const bubble = row.querySelector('.bubble');
    if(!bubble.querySelector('.stream-text')){
      bubble.innerHTML = '<span class="stream-text"></span>';
    }
    return bubble.querySelector('.stream-text');
  }

  function updateStreamingRow(text){
    const target = ensureStreamBubble();
    target.textContent = text;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function typewriterReveal(fullText){
    return new Promise(resolve => {
      const target = ensureStreamBubble();
      if(!fullText){ resolve(); return; }
      let shown = 0;
      const chunk = Math.max(1, Math.ceil(fullText.length / 100));
      typewriterTimer = setInterval(() => {
        shown += chunk;
        if(shown >= fullText.length){
          target.textContent = fullText;
          clearInterval(typewriterTimer);
          typewriterTimer = null;
          pendingTypewriterResolve = null;
          resolve();
        } else {
          target.textContent = fullText.slice(0, shown);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      }, 14);
      pendingTypewriterResolve = () => {
        if(typewriterTimer){ clearInterval(typewriterTimer); typewriterTimer = null; }
        target.textContent = fullText;
        pendingTypewriterResolve = null;
        resolve();
      };
    });
  }

  function extractStreamChunkText(chunk){
    return chunk.split('\n').filter(l => l.indexOf('data:') === 0).map(l => {
      const raw = l.slice(5).trim();
      if(raw === '[DONE]' || raw === '') return '';
      try{
        const obj = JSON.parse(raw);
        return obj.text || obj.delta || obj.content || '';
      }catch(e){
        return raw;
      }
    }).join('');
  }

  function setGeneratingUI(active){
    isGenerating = active;
    sendBtn.classList.toggle('stop-mode', active);
    sendBtn.innerHTML = active ? STOP_ICON : SEND_ICON;
    sendBtn.title = active ? 'Dayandır' : 'Göndər';
  }

  function stopGeneration(){
    if(currentAbortController){ currentAbortController.abort(); }
    if(pendingTypewriterResolve){ pendingTypewriterResolve(); }
  }

  /* ---------- Attachments ---------- */
  attachBtn.onclick = () => fileInput.click();

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    handleAttachedFile(file);
    fileInput.value = '';
  });

  function handleAttachedFile(file){
    const isImage = file.type.startsWith('image/');
    if(isImage){
      if(file.size > 5 * 1024 * 1024){ alert('Şəkil 5MB-dan kiçik olmalıdır.'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        const base64 = String(dataUrl).split(',')[1] || '';
        pendingAttachment = {type:'image', name:file.name, dataUrl:dataUrl, base64:base64, mediaType:file.type};
        renderAttachmentPreview();
      };
      reader.onerror = () => alert('Şəkil oxunmadı.');
      reader.readAsDataURL(file);
    } else {
      if(file.size > 300 * 1024){ alert('Mətn faylı 300KB-dan kiçik olmalıdır.'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        pendingAttachment = {type:'text', name:file.name, content:String(reader.result || '')};
        renderAttachmentPreview();
      };
      reader.onerror = () => alert('Fayl oxunmadı.');
      reader.readAsText(file);
    }
  }

  function clearAttachment(){
    pendingAttachment = null;
    renderAttachmentPreview();
  }

  function renderAttachmentPreview(){
    attachmentPreviewEl.innerHTML = '';
    if(!pendingAttachment){ attachmentPreviewEl.style.display = 'none'; return; }
    attachmentPreviewEl.style.display = 'flex';
    const chip = document.createElement('div');
    chip.className = 'attachment-chip';
    if(pendingAttachment.type === 'image'){
      const img = document.createElement('img');
      img.src = pendingAttachment.dataUrl;
      chip.appendChild(img);
    } else {
      const iconWrap = document.createElement('span');
      iconWrap.className = 'file-chip-icon';
      iconWrap.innerHTML = FILE_ICON;
      chip.appendChild(iconWrap);
    }
    const name = document.createElement('span');
    name.textContent = pendingAttachment.name;
    chip.appendChild(name);
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.innerHTML = CLOSE_ICON;
    removeBtn.title = 'Sil';
    removeBtn.onclick = clearAttachment;
    chip.appendChild(removeBtn);
    attachmentPreviewEl.appendChild(chip);
  }

  function buildApiContent(m){
    if(m.attachment && m.attachment.type === 'image'){
      return [
        {type:'text', text: m.content || ''},
        {type:'image', source:{type:'base64', media_type:m.attachment.mediaType, data:m.attachment.base64}}
      ];
    }
    return m.content;
  }

  /* ---------- Sending / receiving ---------- */
  async function sendMessage(){
    if(isGenerating) return;
    const text = userInput.value.trim();
    const attachment = pendingAttachment;
    if(!text && !attachment) return;
    const conv = conversations.find(c => c.id === currentId);
    if(!conv) return;

    let userMsg;
    if(attachment && attachment.type === 'text'){
      const combined = '[Fayl: ' + attachment.name + ']\n```\n' + attachment.content + '\n```' + (text ? ('\n\n' + text) : '');
      userMsg = {role:'user', content: combined};
    } else if(attachment && attachment.type === 'image'){
      userMsg = {role:'user', content: text, attachment: attachment};
    } else {
      userMsg = {role:'user', content: text};
    }

    if(!conv.title){
      const titleSrc = text || (attachment ? attachment.name : 'Yeni söhbət');
      conv.title = titleSrc.length > 42 ? titleSrc.slice(0,42) + '…' : titleSrc;
    }
    conv.messages.push(userMsg);
    userInput.value = '';
    clearAttachment();
    autoResize();
    renderHistory();
    renderMessages();
    saveState();

    await requestAssistantReply(conv);
  }

  async function requestAssistantReply(conv){
    setGeneratingUI(true);
    showTyping();

    const apiMessages = conv.messages
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .map(m => ({role: m.role, content: buildApiContent(m)}));

    const controller = new AbortController();
    currentAbortController = controller;
    let streamedText = '';

    try{
      const response = await fetch('https://heze-ai-final.onrender.com/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ messages: apiMessages }),
        signal: controller.signal
      });

      const contentType = response.headers.get('content-type') || '';

      if(response.ok && response.body && (contentType.indexOf('text/event-stream') !== -1 || contentType.indexOf('ndjson') !== -1)){
        ensureStreamBubble();
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        while(true){
          const res = await reader.read();
          if(res.done) break;
          const chunk = decoder.decode(res.value, {stream:true});
          streamedText += extractStreamChunkText(chunk);
          updateStreamingRow(streamedText);
        }
        conv.messages.push({role:'assistant', content: streamedText});
      } else {
        const data = await response.json();
        if(response.ok && data && data.reply){
          await typewriterReveal(data.reply);
          conv.messages.push({role:'assistant', content: data.reply});
        } else {
          conv.messages.push({role:'assistant', content: (data && data.error) || 'Xəta baş verdi, bir az sonra yenidən cəhd et.', isError:true});
        }
      }
    } catch(err){
      if(err && err.name === 'AbortError'){
        if(streamedText){ conv.messages.push({role:'assistant', content: streamedText}); }
      } else {
        conv.messages.push({role:'assistant', content:'Serverə qoşulmaq mümkün olmadı. Backend server işə salınıbmı yoxlayın.', isError:true});
      }
    }

    hideTyping();
    currentAbortController = null;
    setGeneratingUI(false);
    renderMessages();
    saveState();
  }

  function autoResize(){
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
  }

  function closeSidebarMobile(){
    sidebar.classList.remove('open');
    backdrop.classList.remove('open');
  }

  /* ---------- Export ---------- */
  function exportAsTxt(){
    const conv = conversations.find(c => c.id === currentId);
    if(!conv || !conv.messages.length){ alert('İxrac ediləcək söhbət yoxdur.'); return; }
    let text = (conv.title || 'Heze AI söhbəti') + '\n' + '='.repeat(30) + '\n\n';
    conv.messages.forEach(m => {
      text += (m.role === 'user' ? 'Sən' : 'Heze AI') + ':\n' + (m.content || '') + '\n\n';
    });
    const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (conv.title || 'heze-ai-sohbet').replace(/[^\w\u0080-\uFFFF -]/g,'').slice(0,50 ) + '.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function exportAsPdf(){
    const conv = conversations.find(c => c.id === currentId);
    if(!conv || !conv.messages.length){ alert('İxrac ediləcək söhbət yoxdur.'); return; }
    window.print();
  }

  exportBtn.onclick = (e) => { e.stopPropagation(); exportMenu.classList.toggle('open'); };
  exportMenu.querySelectorAll('button').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      exportMenu.classList.remove('open');
      const format = btn.dataset.format;
      if(format === 'txt') exportAsTxt();
      else if(format === 'pdf') exportAsPdf();
    };
  });
  document.addEventListener('click', () => exportMenu.classList.remove('open'));

  /* ---------- Wiring ---------- */
  document.getElementById('newChatBtn').onclick = newChat;
  document.getElementById('menuBtn').onclick = () => { sidebar.classList.add('open'); backdrop.classList.add('open'); };
  document.getElementById('sidebarClose').onclick = closeSidebarMobile;
  backdrop.onclick = closeSidebarMobile;

  sendBtn.onclick = () => { if(isGenerating){ stopGeneration(); } else { sendMessage(); } };
  userInput.addEventListener('input', autoResize);
  userInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  initTheme();
  loadState();
</script>
