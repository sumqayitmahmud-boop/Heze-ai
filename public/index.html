<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heze AI</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ccircle%20cx='50'%20cy='50'%20r='48'%20fill='white'%20stroke='black'%20stroke-width='3'/%3E%3Ccircle%20cx='50'%20cy='50'%20r='40'%20fill='white'%20stroke='black'%20stroke-width='3'/%3E%3Cpolygon%20points='50,50%2045,38%2050,16%2055,38'%20fill='%233B6FE0'/%3E%3Cpolygon%20points='50,50%2055,38%2074,26%2062,45'%20fill='%23E0473B'/%3E%3Cpolygon%20points='50,50%2062,45%2084,50%2062,55'%20fill='%232FA35B'/%3E%3Cpolygon%20points='50,50%2062,55%2074,74%2055,62'%20fill='%233B6FE0'/%3E%3Cpolygon%20points='50,50%2055,62%2050,84%2045,62'%20fill='%23E0473B'/%3E%3Cpolygon%20points='50,50%2045,62%2026,74%2038,55'%20fill='%232FA35B'/%3E%3Cpolygon%20points='50,50%2038,55%2016,50%2038,45'%20fill='%233B6FE0'/%3E%3Cpolygon%20points='50,50%2038,45%2026,26%2045,38'%20fill='%23E0473B'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root{
    --bg-main:#ffffff;
    --bg-sidebar:#F7F4F1;
    --bg-soft:#F1ECE6;
    --accent:#B33A3A;
    --accent-dark:#8C2E2E;
    --text:#2B2230;
    --text-soft:#79726F;
    --border:#E9E2D9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:var(--bg-main);
    overflow:hidden;
  }
  button{font-family:inherit;}
  textarea{font-family:inherit;}

  .app{display:flex;height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:264px;flex-shrink:0;background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    padding:18px 12px;
    transition:transform .2s ease;
    z-index:20;
  }
  .brand{
    display:flex;align-items:center;gap:9px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;font-weight:600;
    padding:2px 8px 16px;
  }
  .brand svg{flex-shrink:0;}
  .new-chat-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;
    transition:background .15s;
  }
  .new-chat-btn:hover{background:var(--accent-dark);}
  .new-chat-btn:focus-visible{outline:2px solid var(--accent-dark);outline-offset:2px;}

  .history-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--text-soft);padding:18px 10px 6px;
  }
  .history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .history-item{
    padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--text-soft);
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .history-item:hover{background:var(--bg-soft);}
  .history-item.active{background:#fff;color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--border);}
  .history-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .sidebar-footer{font-size:11px;color:var(--text-soft);opacity:.75;padding:10px 8px 0;}
  .sidebar-close{display:none;}

  /* ---------- Main chat area ---------- */
  .chat-area{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff;}

  .mobile-topbar{display:none;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);}
  .mobile-topbar button{background:none;border:none;cursor:pointer;padding:4px;color:var(--text);}

  .messages{flex:1;overflow-y:auto;padding:8px 0 20px;}
  .messages-inner{max-width:720px;margin:0 auto;padding:20px 24px 0;display:flex;flex-direction:column;gap:22px;}

  .empty-state{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px;gap:8px;
  }
  .empty-state .mark{margin-bottom:10px;}
  .empty-state h1{font-family:Georgia,"Times New Roman",serif;font-size:26px;margin:0;font-weight:600;}
  .empty-state p{color:var(--text-soft);font-size:14.5px;margin:0 0 14px;}
  .suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:480px;}
  .suggestion-chip{
    border:1px solid var(--border);background:#fff;border-radius:10px;
    padding:9px 13px;font-size:13px;color:var(--text);cursor:pointer;transition:border-color .15s;
  }
  .suggestion-chip:hover{border-color:var(--accent);}
  .suggestion-chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .msg{display:flex;gap:11px;animation:fadeIn .25s ease;}
  .msg.user{flex-direction:row-reverse;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .avatar{
    width:29px;height:29px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:700;color:#fff;margin-top:2px;
  }
  .avatar.user-avatar{background:#C9BFB2;}
  .bubble{padding:11px 16px;border-radius:14px;font-size:15px;line-height:1.62;max-width:100%;min-width:0;}
  .msg.user .bubble{background:var(--bg-soft);color:var(--text);border-top-right-radius:4px;white-space:pre-wrap;word-wrap:break-word;}
  .msg.assistant .bubble{background:#fff;border:1px solid var(--border);border-top-left-radius:4px;overflow-x:auto;}
  .bubble p{margin:0 0 10px;}
  .bubble p:last-child{margin-bottom:0;}
  .bubble pre{background:#F7F4F1;padding:12px 14px;border-radius:9px;overflow-x:auto;font-size:13px;margin:8px 0;}
  .bubble code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
  .bubble :not(pre)>code{background:var(--bg-soft);padding:1px 5px;border-radius:4px;font-size:13px;}
  .bubble ul,.bubble ol{margin:0 0 10px;padding-left:20px;}
  .bubble a{color:var(--accent-dark);}

  .typing .bubble{display:flex;align-items:center;gap:4px;padding:14px 16px;}
  .typing .bubble span{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.1s infinite ease-in-out;}
  .typing .bubble span:nth-child(2){animation-delay:.15s;}
  .typing .bubble span:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,60%,100%{opacity:.3;transform:scale(.85);}30%{opacity:1;transform:scale(1);}}

  .input-bar{border-top:1px solid var(--border);padding:14px 24px 18px;}
  .input-inner{
    max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;
    background:var(--bg-sidebar);border:1px solid var(--border);border-radius:20px;
    padding:6px 6px 6px 18px;
  }
  #userInput{
    flex:1;border:none;background:transparent;resize:none;outline:none;
    font-size:15px;line-height:1.5;max-height:160px;padding:9px 0;color:var(--text);
  }
  #userInput::placeholder{color:var(--text-soft);}
  #sendBtn{
    width:36px;height:36px;border-radius:50%;background:var(--accent);border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
    transition:background .15s,transform .1s;color:#fff;
  }
  #sendBtn:hover:not(:disabled){background:var(--accent-dark);}
  #sendBtn:active:not(:disabled){transform:scale(.92);}
  #sendBtn:disabled{background:#DCD5C9;cursor:not-allowed;}
  #sendBtn:focus-visible{outline:2px solid var(--accent-dark);outline-offset:2px;}
  .hint{max-width:720px;margin:6px auto 0;font-size:11px;color:var(--text-soft);text-align:center;padding:0 24px;}

  .backdrop{display:none;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

  @media (max-width:760px){
    .mobile-topbar{display:flex;}
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);
    }
    .sidebar.open{transform:translateX(0);box-shadow:2px 0 24px rgba(0,0,0,.15);}
    .sidebar-close{display:block;margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text-soft);}
    .backdrop{display:none;position:fixed;inset:0;background:rgba(20,15,15,.35);z-index:15;}
    .backdrop.open{display:block;}
    .messages-inner{padding:16px 16px 0;}
    .input-bar{padding:10px 14px 14px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#1A1A1A" stroke-width="2.4"/>
        <circle cx="50" cy="50" r="40" fill="#ffffff" stroke="#1A1A1A" stroke-width="2.4"/>
        <polygon points="50,50 45.02,37.99 50,16 54.98,37.99" fill="#3B6FE0"/>
        <polygon points="50,50 54.98,37.99 74.04,25.96 62.01,45.02" fill="#E0473B"/>
        <polygon points="50,50 62.01,45.02 84,50 62.01,54.98" fill="#2FA35B"/>
        <polygon points="50,50 62.01,54.98 74.04,74.04 54.98,62.01" fill="#3B6FE0"/>
        <polygon points="50,50 54.98,62.01 50,84 45.02,62.01" fill="#E0473B"/>
        <polygon points="50,50 45.02,62.01 25.96,74.04 37.99,54.98" fill="#2FA35B"/>
        <polygon points="50,50 37.99,54.98 16,50 37.99,45.02" fill="#3B6FE0"/>
        <polygon points="50,50 37.99,45.02 25.96,25.96 45.02,37.99" fill="#E0473B"/>
      </svg>
      <span>Heze AI</span>
      <button class="sidebar-close" id="sidebarClose" aria-label="Bağla">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      Yeni söhbət
    </button>
    <div class="history-label">Söhbətlər</div>
    <div class="history" id="historyList"></div>
    <div class="sidebar-footer">Sadə, sürətli, sənin dilində</div>
  </aside>

  <main class="chat-area">
    <div class="mobile-topbar">
      <button id="menuBtn" aria-label="Menyu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <strong>Heze AI</strong>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <div class="input-inner">
        <textarea id="userInput" rows="1" placeholder="Heze AI-ə mesaj yaz..."></textarea>
        <button id="sendBtn" aria-label="Göndər">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="hint">Enter — göndər · Shift+Enter — yeni sətir</div>
    </div>
  </main>
</div>

<script>
  function logoSvg(size){
    size = size || 28;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'
      + '<circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#1A1A1A" stroke-width="2.4"/>'
      + '<circle cx="50" cy="50" r="40" fill="#ffffff" stroke="#1A1A1A" stroke-width="2.4"/>'
      + '<polygon points="50,50 45.02,37.99 50,16 54.98,37.99" fill="#3B6FE0"/>'
      + '<polygon points="50,50 54.98,37.99 74.04,25.96 62.01,45.02" fill="#E0473B"/>'
      + '<polygon points="50,50 62.01,45.02 84,50 62.01,54.98" fill="#2FA35B"/>'
      + '<polygon points="50,50 62.01,54.98 74.04,74.04 54.98,62.01" fill="#3B6FE0"/>'
      + '<polygon points="50,50 54.98,62.01 50,84 45.02,62.01" fill="#E0473B"/>'
      + '<polygon points="50,50 45.02,62.01 25.96,74.04 37.99,54.98" fill="#2FA35B"/>'
      + '<polygon points="50,50 37.99,54.98 16,50 37.99,45.02" fill="#3B6FE0"/>'
      + '<polygon points="50,50 37.99,45.02 25.96,25.96 45.02,37.99" fill="#E0473B"/>'
      + '</svg>';
  }

  const SUGGESTIONS = [
    'Salam de və özünü tanıt',
    'Sadə bir Python funksiyası yaz',
    'Azərbaycan tarixindən maraqlı bir fakt söylə',
    'Qısa bir hekayə yaz'
  ];

  let conversations = [];
  let currentId = null;

  const historyList = document.getElementById('historyList');
  const messagesEl   = document.getElementById('messages');
  const userInput    = document.getElementById('userInput');
  const sendBtn      = document.getElementById('sendBtn');
  const sidebar      = document.getElementById('sidebar');
  const backdrop     = document.getElementById('backdrop');

  function uid(){ return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

  async function loadState(){
    try{
      const raw = localStorage.getItem('heze-conversations');
      if(raw){ conversations = JSON.parse(raw); }
    }catch(e){ conversations = []; }
    if(conversations.length){
      currentId = conversations[0].id;
    } else {
      newChat();
    }
    renderAll();
  }

  async function saveState(){
    try{ localStorage.setItem('heze-conversations', JSON.stringify(conversations)); }
    catch(e){ console.error('Yaddaşa yazma xətası:', e); }
  }

  function newChat(){
    const conv = {id: uid(), title: null, messages: []};
    conversations.unshift(conv);
    currentId = conv.id;
    renderAll();
    saveState();
    closeSidebarMobile();
    userInput.focus();
  }

  function openConversation(id){
    const conv = conversations.find(c => c.id === id);
    if(!conv) return;
    currentId = id;
    renderAll();
    closeSidebarMobile();
  }

  function renderAll(){
    renderHistory();
    renderMessages();
  }

  function renderHistory(){
    historyList.innerHTML = '';
    conversations.forEach(c => {
      const div = document.createElement('div');
      div.className = 'history-item' + (c.id === currentId ? ' active' : '');
      div.textContent = c.title || 'Yeni söhbət';
      div.tabIndex = 0;
      div.onclick = () => openConversation(c.id);
      div.onkeydown = (e) => { if(e.key === 'Enter') openConversation(c.id); };
      historyList.appendChild(div);
    });
  }

  function renderMessages(){
    const conv = conversations.find(c => c.id === currentId);
    messagesEl.innerHTML = '';
    if(!conv || conv.messages.length === 0){
      messagesEl.appendChild(buildEmptyState());
      return;
    }
    const inner = document.createElement('div');
    inner.className = 'messages-inner';
    conv.messages.forEach(m => inner.appendChild(buildMsgEl(m)));
    messagesEl.appendChild(inner);
    if(window.hljs){ inner.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b)); }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function buildEmptyState(){
    const wrap = document.createElement('div');
    wrap.className = 'empty-state';
    const markWrap = document.createElement('div');
    markWrap.className = 'mark';
    markWrap.innerHTML = logoSvg(52);
    wrap.appendChild(markWrap);
    const h1 = document.createElement('h1');
    h1.textContent = 'Heze AI-a xoş gəlmisən';
    const p = document.createElement('p');
    p.textContent = 'Sualını aşağıya yaz, ya da bir təklifə toxun.';
    wrap.appendChild(h1);
    wrap.appendChild(p);
    const chips = document.createElement('div');
    chips.className = 'suggestions';
    SUGGESTIONS.forEach(s => {
      const chip = document.createElement('button');
      chip.className = 'suggestion-chip';
      chip.textContent = s;
      chip.onclick = () => { userInput.value = s; sendMessage(); };
      chips.appendChild(chip);
    });
    wrap.appendChild(chips);
    return wrap;
  }

  function buildMsgEl(m){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + m.role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar' + (m.role === 'user' ? ' user-avatar' : '');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if(m.role === 'user'){
      avatar.textContent = 'Sən';
      bubble.textContent = m.content;
    } else {
      avatar.innerHTML = logoSvg(29);
      bubble.innerHTML = (window.marked ? marked.parse(m.content || '') : (m.content || ''));
    }
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    return wrap;
  }

  function showTyping(){
    let inner = messagesEl.querySelector('.messages-inner');
    if(!inner){
      messagesEl.innerHTML = '';
      inner = document.createElement('div');
      inner.className = 'messages-inner';
      messagesEl.appendChild(inner);
    }
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant typing';
    wrap.id = 'typingRow';
    wrap.innerHTML =
      '<div class="avatar">' + logoSvg(29) + '</div>' +
      '<div class="bubble"><span></span><span></span><span></span></div>';
    inner.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping(){
    const row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  async function sendMessage(){
    const text = userInput.value.trim();
    if(!text) return;
    const conv = conversations.find(c => c.id === currentId);
    if(!conv) return;

    if(!conv.title){ conv.title = text.length > 42 ? text.slice(0,42) + '…' : text; }
    conv.messages.push({role:'user', content:text});
    userInput.value = '';
    autoResize();
    renderHistory();
    renderMessages();
    saveState();

    sendBtn.disabled = true;
    showTyping();

    try{
      const apiMessages = conv.messages
        .filter(m => m.role === 'user' || m.role === 'assistant')
        .map(m => ({role: m.role, content: m.content}));

      // DİQQƏT: API açarı burada YOXDUR — sorğu öz backend serverimizə gedir,
      // açar isə yalnız serverdə (.env faylında) saxlanılır.
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ messages: apiMessages })
      });
      const data = await response.json();
      hideTyping();
      if(response.ok && data && data.reply){
        conv.messages.push({role:'assistant', content: data.reply});
      } else {
        conv.messages.push({role:'assistant', content: data?.error || 'Xəta baş verdi, bir az sonra yenidən cəhd et.'});
      }
    } catch(err){
      hideTyping();
      conv.messages.push({role:'assistant', content:'Serverə qoşulmaq mümkün olmadı. Backend server işə salınıbmı yoxlayın.'});
    }

    sendBtn.disabled = false;
    renderMessages();
    saveState();
  }

  function autoResize(){
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
  }

  function closeSidebarMobile(){
    sidebar.classList.remove('open');
    backdrop.classList.remove('open');
  }

  document.getElementById('newChatBtn').onclick = newChat;
  document.getElementById('menuBtn').onclick = () => { sidebar.classList.add('open'); backdrop.classList.add('open'); };
  document.getElementById('sidebarClose').onclick = closeSidebarMobile;
  backdrop.onclick = closeSidebarMobile;

  sendBtn.onclick = sendMessage;
  userInput.addEventListener('input', autoResize);
  userInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  loadState();
</script>
</body>
</html>
